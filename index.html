<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/roomieg.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomieG.in</title>
    <meta name="description" content="Find the right roommate, not just an empty room." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('roomieg-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
